<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direccion - Sagrado Corazon de Jesus</title>
<link rel="stylesheet" href="../assets/css/estilos.css">
</head>
<body>
<div class="app" id="app"></div>

<script type="module">
import { iniciarPanel, bloqueProvisional, svg } from '../assets/js/layout.js';
import { escapar } from '../assets/js/ui.js';

iniciarPanel('DIRECTOR', (contenedor, usuario) => {
  contenedor.innerHTML = `
    <div class="tarjeta" style="margin-bottom:16px">
      <h3>Bienvenido(a), ${escapar(usuario.nombres)} ${escapar(usuario.apellidos)}</h3>
      <p>Sesion iniciada como <span class="badge azul">DIRECTOR</span> - usuario: ${escapar(usuario.usuario)}</p>
    </div>
    <div class="rejilla">
      <div class="indicador tarjeta">
        <div class="icono">${svg('incidencias')}</div>
        <div><div class="valor">-</div><div class="etiqueta">Incidencias por atender</div></div>
      </div>
      <div class="indicador tarjeta">
        <div class="icono">${svg('docentes')}</div>
        <div><div class="valor">-</div><div class="etiqueta">Docentes registrados</div></div>
      </div>
      <div class="indicador tarjeta">
        <div class="icono">${svg('economia')}</div>
        <div><div class="valor">-</div><div class="etiqueta">Recaudacion del mes</div></div>
      </div>
    </div>
    <div style="margin-top:16px">
      ${bloqueProvisional('Modulos de la direccion', 'Incidencias, evaluacion docente, altas de docentes, cursos, horarios, UGEL, plantillas y economia se habilitan en los siguientes sprints.', 'Sprint 5 y 6')}
    </div>`;
});
</script>
</body>
</html>
